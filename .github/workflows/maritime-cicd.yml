name: Maritime Platform CI/CD

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: maritimeregistry70396.azurecr.io
  IMAGE_NAME: maritimeiq-platform
  AZURE_RESOURCE_GROUP: maritime-platform-rg
  IMAGE_TAG: maritimeregistry70396.azurecr.io/maritimeiq-platform:latest

jobs:
  # Job 1: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        ls -la *.sln || true
        dotnet restore ./Maritime_DataEngineering_Plaatform.sln
      working-directory: ${{ github.workspace }}

    - name: Build application
      run: dotnet build ./Maritime_DataEngineering_Plaatform.sln --no-restore --configuration Release
      working-directory: ${{ github.workspace }}

    - name: Run tests
      continue-on-error: true
      run: dotnet test ./Maritime_DataEngineering_Plaatform.sln --no-build --configuration Release --verbosity normal
      working-directory: ${{ github.workspace }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: |
          ${{ env.IMAGE_NAME }}:latest
          ${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

    - name: Set image tag output
      id: set-tag
      run: echo "image-tag=${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

  # Azure deployment jobs disabled until credentials are configured
  # Uncomment and configure secrets.AZURE_CREDENTIALS to enable deployment
  
  # Job 2: Security Scanning (Requires ACR access)
  # security-scan:
  #   runs-on: ubuntu-latest
  #   needs: build-and-test
  #   if: false
